<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Account - EventCircle</title>
    <style>
        :root {
            --primary: #4f46e5;
            --danger: #ef4444;
            --bg: #f8fafc;
            --text: #1e293b;
            --text-light: #64748b;
            --surface: #ffffff;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            line-height: 1.6;
            color: var(--text);
            background-color: var(--bg);
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            max-width: 500px;
            width: 90%;
            padding: 40px;
            background: var(--surface);
            border-radius: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        header {
            margin-bottom: 30px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 10px;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.025em;
            margin-bottom: 15px;
        }

        p {
            color: var(--text-light);
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        .warning-box {
            background: #fff1f2;
            border: 1px solid #fecdd3;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            text-align: left;
        }

        .warning-box h3 {
            color: var(--danger);
            margin-top: 0;
            font-size: 1rem;
        }

        .warning-box ul {
            margin: 0;
            padding-left: 20px;
            font-size: 0.85rem;
            color: #991b1b;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        input[type="email"], textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            background: var(--danger);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 1rem;
        }

        .btn:hover {
            background: #dc2626;
        }

        .footer-note {
            margin-top: 30px;
            font-size: 0.8rem;
            color: var(--text-light);
        }

        .contact-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="logo">EventCircle</div>
        <h1>Account Deletion Request</h1>
    </header>

    <div class="warning-box">
        <h3>Important Notice</h3>
        <ul>
            <li>Your profile and all event-related data will be permanently removed.</li>
            <li>Any active subscriptions or credits may be lost.</li>
            <li>This action cannot be undone.</li>
        </ul>
    </div>

    <form action="mailto:mahatosoftware@gmail.com" method="post" enctype="text/plain">
        <div class="form-group">
            <label for="email">Email address associated with your account</label>
            <input type="email" id="email" name="Email" placeholder="e.g. yourname@example.com" required>
        </div>
        
        <div class="form-group">
            <label for="reason">Reason for deletion (Optional)</label>
            <textarea id="reason" name="Reason" rows="3" placeholder="Let us know how we can improve..."></textarea>
        </div>

        <button type="submit" class="btn">Send Deletion Request</button>
    </form>

    <div class="footer-note">
        Or email us directly at: <br>
        <a href="mailto:mahatosoftware@gmail.com" class="contact-link">mahatosoftware@gmail.com</a>
    </div>
</div>

</body>
</html>
